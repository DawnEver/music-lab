<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Music Lab — browser-based tuning, audio analysis, and metronome tools." />
  <!-- Updated to the active tool route by the router. -->
  <link rel="canonical" href="https://music.mingyangbao.site/tune" />
  <title>音乐实验室 · Music Lab</title>
  <link rel="icon" href="./favicon.ico" />
  <script>
    // Pre-apply the stored theme before first paint to avoid a theme flash.
    try {
      // ml.theme is written by lib/persist.ts; tcl-theme is the pre-rename key.
      var theme = localStorage.getItem("ml.theme") || localStorage.getItem("tcl-theme");
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
    } catch (e) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
